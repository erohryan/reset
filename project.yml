name: Reset
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# Info.plist keys shared by both app targets.
targetTemplates:
  ResetApp:
    type: application
    platform: iOS
    sources:
      - path: Reset
      - path: Shared
    info:
      path: Reset/Resources/${target_name}-Info.plist
      properties:
        CFBundleDisplayName: reset
        UILaunchScreen:
          UIColorName: Paper
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Light
        UIAppFonts:
          - InstrumentSerif-Italic.ttf
          - Figtree.ttf
          - JetBrainsMono.ttf
        NFCReaderUsageDescription: reset reads your puck to rest and wake your apps.
        ResetAppGroup: $(APP_GROUP_ID)

targets:
  # Full app: real NFC + real Screen Time blocking. Needs a paid developer team.
  Reset:
    templates: [ResetApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).reset
        CODE_SIGN_ENTITLEMENTS: Reset/Resources/Reset.entitlements
    dependencies:
      - target: ResetShield
      - target: ResetShieldAction

  # Demo app: mock NFC + mock blocking, no restricted entitlements.
  # Signs with a free Apple ID and runs in the Simulator.
  ResetDemo:
    templates: [ResetApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).reset.demo
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) RESET_DEMO

  # Branded screen iOS shows when a napping app is opened.
  ResetShield:
    type: app-extension
    platform: iOS
    sources:
      - path: ResetShield
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).reset.shield
        CODE_SIGN_ENTITLEMENTS: ResetShield/ResetShield.entitlements
    info:
      path: ResetShield/Info.plist
      properties:
        CFBundleDisplayName: reset shield
        ResetAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension

  # Handles the shield's "Back to home" button.
  ResetShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ResetShieldAction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).reset.shieldaction
        CODE_SIGN_ENTITLEMENTS: ResetShield/ResetShield.entitlements
    info:
      path: ResetShieldAction/Info.plist
      properties:
        CFBundleDisplayName: reset shield action
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension

  ResetTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ResetTests]
    dependencies:
      - target: ResetDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).reset.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ResetDemo.app/ResetDemo
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ResetDemo:
    build:
      targets:
        ResetDemo: all
        ResetTests: [test]
    test:
      targets: [ResetTests]
  Reset:
    build:
      targets:
        Reset: all
